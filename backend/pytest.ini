[pytest]
# pytest configuration for Voicecon backend

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Show slowest tests
    --durations=10
    # pytest-postgresql ships a plugin that imports `pkg_resources`, which
    # setuptools>=81 no longer provides. Nothing here uses it (unit tests run on
    # in-memory SQLite, integration tests build their own engine), so it is off
    # rather than pinned.
    -p no:postgresql

# Coverage is opt-in: `pytest --cov=app --cov-report=term-missing`. Baking it
# into addopts makes every single-test run pay the instrumentation cost and
# makes a focused run "fail" on the project-wide threshold.

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    e2e: End-to-end tests for complete flows
    slow: Tests that take a long time to run
    auth: Authentication and authorization tests
    billing: Billing and subscription tests
    calls: Call flow tests
    agents: Agent-related tests
    integrations: Integration connector tests
    workflows: Workflow execution tests
    templates: Template marketplace tests
    knowledge_base: RAG and knowledge base tests

# Async support
asyncio_mode = auto

# Quieten the background schedulers that otherwise bury tracebacks in INFO logs.
log_cli = false

filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
